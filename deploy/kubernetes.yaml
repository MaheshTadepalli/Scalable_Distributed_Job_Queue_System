apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-queue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-queue
  template:
    metadata:
      labels:
        app: job-queue
    spec:
      containers:
        - name: job-queue
          image: job-queue:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JOB_QUEUE_PORT
              value: "8080"
            - name: JOB_QUEUE_WORKERS
              value: "4"
            - name: JOB_QUEUE_MAX_RETRIES
              value: "3"
            - name: JOB_QUEUE_RETRY_DELAY_MS
              value: "1500"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: job-queue
spec:
  type: LoadBalancer
  selector:
    app: job-queue
  ports:
    - port: 8080
      targetPort: 8080
